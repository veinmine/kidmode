# Checks the mod on pushes to main and pull requests into main: formatting,
# clippy and its tests, against the mod API of the Horizon build it pins.
# Work on develop doesn't run it. Building it into the game needs the
# launcher, so that stays a local step (horizon-launcher native-build, see
# README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The repository uses SHA-256 object IDs. actions/checkout creates a
      # SHA-1 repository and then can't fetch the commit, so check out by hand.
      - name: Check out (SHA-256 repository)
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q --object-format=sha256 .
          git remote add origin "$SERVER/$REPO"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            -c protocol.version=2 fetch --no-tags --depth=1 origin "$SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Checked out %H %s'
      # The mod API's source for the build horizon-mod.toml pins (what
      # `cargo horizon-mod` puts in .horizon/sdk/api), checked against the
      # SDK release's sdk.json, which also names the Rust the launcher builds
      # that build's mods with.
      - name: Fetch the pinned SDK's API
        run: |
          build=$(sed -n 's/^horizon = "\([0-9a-f]\{40\}\)"$/\1/p' horizon-mod.toml)
          base="https://github.com/horizon-rust/horizon/releases/download/sdk-$build"
          curl -sSfL -o sdk.json "$base/sdk.json"
          curl -sSfL -o api-source.tar.xz "$base/api-source.tar.xz"
          want=$(python3 -c 'import json; print(json.load(open("sdk.json"))["assets"]["api-source.tar.xz"]["sha256"])')
          echo "$want  api-source.tar.xz" | sha256sum -c -
          mkdir -p .horizon/sdk/api
          tar xJf api-source.tar.xz -C .horizon/sdk/api
      # The runner image has no Rust, so install rustup when it's missing.
      - name: Install Rust (the SDK's)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rust=$(python3 -c 'import json; print(json.load(open("sdk.json"))["toolchain"]["rust"])')
          rustup toolchain install "$rust" --profile minimal --component rustfmt,clippy
          rustup default "$rust"
          rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
