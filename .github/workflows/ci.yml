# Checks the mod's own logic on pushes to main and pull requests into main:
# formatting, clippy and its tests. Work on develop doesn't run it.
# Building it into the game needs the pinned Horizon source, so that stays a
# local step (horizon-launcher native-build, see README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The repository uses SHA-256 object IDs. actions/checkout creates a
      # SHA-1 repository and then can't fetch the commit, so check out by hand.
      - name: Check out (SHA-256 repository)
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q --object-format=sha256 .
          git remote add origin "$SERVER/$REPO"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            -c protocol.version=2 fetch --no-tags --depth=1 origin "$SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Checked out %H %s'
      # The runner image has no Rust, so install rustup when it's missing.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
