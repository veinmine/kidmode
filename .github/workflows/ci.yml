# Checks the mod's own logic on pushes to main and pull requests into main:
# formatting, clippy and its tests. Work on develop doesn't run it.
# Building it into the game needs the pinned Horizon source, so that stays a
# local step (horizon-launcher native-build, see README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner image has no Rust, so install rustup when it's missing.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
