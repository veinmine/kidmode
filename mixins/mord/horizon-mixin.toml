[mod]
id = "mord"
version = "0.3.0"
priority = 100

# The commit it was built and tested on (Nightly 2026-11-13). Besides the native
# hook points it changes the mob engine itself (horizon_client_lib::mobs), so
# it is tied to this commit.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The mod's logic, in the mob engine's crate so its hooks can reach it; the
# game crate reaches it as crate::mobs::mord too.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/mobs.rs"
name = "mord"
visibility = "pub"
source = "runtime.rs"

# ---- Options > Mods ------------------------------------------------------

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Reads the settings on the server side before mobs tick.
[[injection]]
id = "load"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "load.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# ---- Friendly enemies / Friendly neutral mobs ----------------------------

# Mob.canAttack(player) is false for a friendly mob.
[[injection]]
id = "spares"
kind = "RETURN"
target = "horizon_client_lib::mobs::goals::Mob::spares_players"
helper = "spares.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "self" },
]

# Backup: what a friendly mob's tick does to the player is dropped.
[[injection]]
id = "tick-start"
kind = "HEAD"
target = "horizon_client_lib::mobs::Mob::tick"
helper = "tick_start.rs"
bindings = [
  { name = "events", ty = "&Vec<crate::mobs::MobEvent>", value = "&*events" },
]

[[injection]]
id = "tick-end"
kind = "RETURN"
target = "horizon_client_lib::mobs::Mob::tick"
helper = "tick_end.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*self" },
  { name = "events", ty = "&mut Vec<crate::mobs::MobEvent>", value = "&mut *events" },
]

# ---- Invulnerable animals / Invulnerable enemies -------------------------

# isInvulnerableTo: every hit but /kill and the void is refused.
[[injection]]
id = "refuses"
kind = "RETURN"
target = "horizon_client_lib::mobs::Mob::refuses_damage"
helper = "refuses.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "self" },
  { name = "source", ty = "&crate::mobs::Damage", value = "source" },
]

# No panic, not even from fire.
[[injection]]
id = "should-panic"
kind = "RETURN"
target = "horizon_client_lib::mobs::goals::should_panic"
helper = "no_panic.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "m" },
]

[[injection]]
id = "panic-goal"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::mobs::goals::<Panic as Goal>::can_use"
helper = "panic_goal.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
]

[[injection]]
id = "panda-panic"
kind = "RETURN"
target = "horizon_client_lib::mobs::panda::environmental"
helper = "no_panic.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "m" },
]

[[injection]]
id = "polar-bear-panic"
kind = "RETURN"
target = "horizon_client_lib::mobs::polar_bear::environmental_panic"
helper = "no_panic.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "m" },
]

# Explosions don't push them.
[[injection]]
id = "blast"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_explosion_knockback"
helper = "blast.rs"
bindings = [
  { name = "entity", ty = "Option<u32>", value = "entity" },
  { name = "knockback_velocity", ty = "&mut [f64; 3]", value = "&mut *knockback_velocity" },
]
