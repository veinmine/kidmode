[mod]
id = "mord"
version = "0.2.0"
priority = 100

# The commit it was tested on (Nightly 2026-11-13). It uses only the native
# hook points (hooks 1 in compatibility.json): the launcher builds it on any
# Horizon that has them.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mord"
source = "runtime.rs"

# Lists the mod in Options > Mods.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The settings page under Options > Mods > Mord.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Reads the setting on the server side before mobs tick.
[[injection]]
id = "load"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "load.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Friendly enemies / neutral mobs: they may not target a player...
[[injection]]
id = "target"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_change_target"
helper = "target.rs"
bindings = [
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "target", ty = "Option<u128>", value = "target" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# ...a hit from one on a player is cancelled, and so is any hit on an
# invulnerable mob.
[[injection]]
id = "damage"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_incoming_damage_v3"
helper = "damage.rs"
bindings = [
  { name = "victim", ty = "u32", value = "victim" },
  { name = "victim_uuid", ty = "Option<u128>", value = "victim_uuid" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "attacker", ty = "Option<u32>", value = "attacker" },
  { name = "attacker_uuid", ty = "Option<u128>", value = "attacker_uuid" },
  { name = "damage_type", ty = "&str", value = "damage_type" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# Invulnerable mobs are not pushed: knockback without a hit...
[[injection]]
id = "knockback"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_knockback"
helper = "knockback.rs"
bindings = [
  { name = "kind", ty = "&str", value = "kind" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# ...and explosions.
[[injection]]
id = "blast"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_explosion_knockback"
helper = "blast.rs"
bindings = [
  { name = "entity", ty = "Option<u32>", value = "entity" },
  { name = "knockback_velocity", ty = "&mut [f64; 3]", value = "&mut *knockback_velocity" },
]
