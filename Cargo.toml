[package]
name = "kidmode"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
authors = ["veinmine <veinmine@proton.me>"]
description = "Kid Mode, a native Horizon mod."

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
